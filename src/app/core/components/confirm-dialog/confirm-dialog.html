@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
    (click)="onBackdropClick($event)"
  >
    <div
      class="bg-card-dark border border-white/10 rounded-xl shadow-xl max-w-sm w-full mx-4 overflow-hidden animate-scale-in"
    >
      <!-- Header -->
      <div class="px-6 pt-6 pb-4">
        <h3 class="text-lg font-bold text-text-main">{{ title }}</h3>
      </div>

      <!-- Body -->
      <div class="px-6 pb-6">
        <p class="text-sm text-text-muted">{{ message }}</p>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 bg-white/5 flex justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-sm font-medium text-text-main bg-transparent border border-white/20 rounded-lg hover:bg-white/10 transition-colors"
        >
          {{ cancelText }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [class]="
            'px-4 py-2 text-sm font-medium text-white rounded-lg transition-colors ' +
            confirmButtonClass
          "
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
