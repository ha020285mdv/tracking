<div class="pb-2 px-4 sticky top-0 z-30 bg-background-dark/95 backdrop-blur-sm">
  <div class="flex items-center gap-3 h-14 relative" data-menu-root>
    @if (showBackButton()) {
      <button
        routerLink="/"
        class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors text-text-main shrink-0"
      >
        <span class="material-symbols-outlined text-[28px]"> arrow_back </span>
      </button>
    }

    <!-- user widget (home page only) -->
    @if (!showBackButton()) {
      <div class="flex-1 flex items-center gap-3">
        <div
          class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/20 text-primary shrink-0"
        >
          @if (user?.photoURL) {
            <img
              [src]="user.photoURL"
              alt="User Avatar"
              class="w-10 h-10 rounded-full object-cover"
            />
          } @else {
            <span class="material-symbols-outlined text-[24px]">person</span>
          }
        </div>
        <div class="flex flex-col flex-1 min-w-0">
          <p class="text-base font-bold text-text-main truncate">
            Welcome{{ user?.displayName ? `, ${user.displayName}` : '' }}!
          </p>
          @if (!user) {
            <button
              routerLink="/login"
              class="w-full text-left text-sm font-bold text-primary hover:text-primary/80 transition-colors"
            >
              Sign In / Sign Up
            </button>
          }
        </div>
      </div>
    }

    <!-- spacer for non-home pages -->
    @if (showBackButton()) {
      <div class="flex-1"></div>
    }

    <!-- menu trigger -->
    <button
      type="button"
      (click)="toggleMenu()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen"
      class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors text-text-main shrink-0"
    >
      <span class="material-symbols-outlined text-[28px]"> menu </span>
    </button>

    <!-- dropdown -->
    @if (menuOpen) {
      <div
        class="absolute right-0 top-14 w-48 rounded-xl bg-background-dark border border-white/10 shadow-xl overflow-hidden z-100"
        role="menu"
      >
        <button
          role="menuitem"
          class="w-full px-4 py-3 text-left text-text-main hover:bg-white/10 transition-colors"
          (click)="goTo('/workouts')"
        >
          All workouts
        </button>

        <button
          role="menuitem"
          class="w-full px-4 py-3 text-left text-text-main hover:bg-white/10 transition-colors"
          (click)="goTo('/history')"
        >
          History
        </button>

        <div class="h-px bg-white/10"></div>

        <!-- TODO: conditionally show log in/sign out -->
        <button
          role="menuitem"
          class="w-full px-4 py-3 text-left text-text-main hover:bg-white/10 transition-colors"
          (click)="signOut()"
        >
          Sign out
        </button>
      </div>
    }
  </div>
</div>
