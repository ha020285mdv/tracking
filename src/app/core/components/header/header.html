<div class="pb-2 px-4 sticky top-0 z-30 bg-background-dark/95 backdrop-blur-sm">
  <div class="flex items-center justify-between h-14 relative" data-menu-root>
    @if (showBackButton) {
    <button
      routerLink="/"
      class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-white/10 transition-colors text-text-main"
    >
      <span class="material-symbols-outlined text-[28px]"> arrow_back </span>
    </button>
    } @else {
    <div class="w-12 h-12"></div>
    }

    <!-- menu trigger -->
    <button
      type="button"
      (click)="toggleMenu()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen"
      class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-white/10 transition-colors text-text-main"
    >
      <span class="material-symbols-outlined text-[28px]"> more_vert </span>
    </button>

    <!-- dropdown -->
    @if (menuOpen) {
    <div
      class="absolute right-0 top-14 w-48 rounded-xl bg-background-dark border border-white/10 shadow-xl overflow-hidden z-100"
      role="menu"
    >
      <button
        role="menuitem"
        class="w-full px-4 py-3 text-left text-text-main hover:bg-white/10 transition-colors"
        (click)="goTo('/workouts')"
      >
        All workouts
      </button>

      <button
        role="menuitem"
        class="w-full px-4 py-3 text-left text-text-main hover:bg-white/10 transition-colors"
        (click)="goTo('/history')"
      >
        History
      </button>

      <div class="h-px bg-white/10"></div>

      <!-- TODO: conditionally show log in/sign out -->
      <button
        role="menuitem"
        class="w-full px-4 py-3 text-left text-text-main hover:bg-white/10 transition-colors"
        (click)="signOut()"
      >
        Sign out
      </button>
    </div>
    }
  </div>
</div>
