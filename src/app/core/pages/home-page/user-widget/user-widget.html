<div
  class="relative w-full mx-auto flex flex-col gap-4 p-5 bg-card-dark rounded-xl shadow-lg border border-primary ring-1 ring-primary/20"
>
  <div class="flex items-center gap-4">
    <div
      class="flex items-center justify-center w-12 h-12 rounded-full bg-primary/20 text-primary shrink-0"
    >
      @if (user?.photoURL) {
        <img [src]="user?.photoURL" alt="User Avatar" class="w-12 h-12 rounded-full object-cover" />
      } @else {
        <span class="material-symbols-outlined text-[28px]">person</span>
      }
    </div>
    <div class="flex flex-col flex-1">
      <p class="text-lg font-bold text-text-main">
        Welcome{{ user?.displayName ? `, ${user?.displayName}` : '' }}!
      </p>
      @if (!user) {
        <button
          routerLink="/login"
          class="w-full text-left text-sm font-bold text-primary hover:text-primary/80 transition-colors mt-1"
        >
          Sign In / Sign Up
        </button>
      }
    </div>
  </div>
</div>
