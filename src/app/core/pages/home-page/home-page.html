<div class="flex-1 px-4 flex flex-col gap-8 overflow-y-auto">
  <app-user-widget></app-user-widget>
  <div class="flex flex-col gap-4">
    <h2 class="px-2 text-xl font-bold text-text-main leading-tight">Your Workouts</h2>
    <div class="flex flex-col gap-3">
      @if (isThereActiveSession()) {
        <button
          routerLink="/session"
          class="px-4 py-3 mt-2 mb-4 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors shadow-sm"
        >
          Go to active session
        </button>
      }
      @for (workout of workouts(); track workout.id) {
        <app-workout-item
          [workout]="workout"
          (makeFavorite)="onMakeFavorite($event)"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
        ></app-workout-item>
      }
      <button
        routerLink="/workouts"
        class="px-4 py-3 mt-2 text-sm font-medium text-text-main bg-transparent border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-black active:text-black transition-colors"
      >
        All workouts
      </button>
    </div>
  </div>
  <app-calendar></app-calendar>
</div>

<!-- Delete Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="isDeleteDialogOpen()"
  title="Delete Workout"
  [message]="
    'Are you sure you want to delete &quot;' +
    (workoutToDelete()?.name || '') +
    '&quot;? This action cannot be undone.'
  "
  [confirmText]="isDeleting() ? 'Deleting...' : 'Delete'"
  cancelText="Cancel"
  (confirmed)="onConfirmDelete()"
  (cancelled)="onCancelDelete()"
></app-confirm-dialog>
