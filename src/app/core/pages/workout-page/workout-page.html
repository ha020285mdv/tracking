@let workoutValue = workout();
@if (workoutValue) {
  <div
    class="pt-6 pb-2 px-4 sticky top-0 z-10 bg-background-dark/95 backdrop-blur-sm border-b border-white/5"
  >
    <!-- components header -->
    <div class="flex items-start justify-between px-2">
      <div class="flex flex-col gap-1">
        <h1 class="text-3xl font-bold text-text-main tracking-tight">{{ workoutValue.name }}</h1>
        <p class="text-text-muted font-medium text-sm flex items-center gap-1">
          <!-- TODO: calculate and show real data based on history -->
          <span class="material-symbols-outlined text-[16px]">schedule</span> ≈45 min
          <span class="mx-1">•</span>
          <!-- TODO: think how to calculate or add as a field to collection -->
          <span class="material-symbols-outlined text-[16px]">equalizer</span> Intermediate
        </p>
      </div>

      <!-- 3-dot menu (only when no active session) -->
      @if (!isThereActiveSession()) {
        <div class="relative">
          <button
            type="button"
            (click)="onToggleMenu($event)"
            aria-label="More options"
            class="p-2 rounded-full hover:bg-white/10 transition-colors"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>

          <div
            class="absolute right-0 top-full mt-1 w-44 bg-card-dark border border-white/10 rounded-lg shadow-lg z-20"
            [hidden]="!isMenuOpen()"
          >
            <button
              type="button"
              class="w-full text-left px-4 py-3 hover:bg-white/5 text-text-main text-sm flex items-center gap-3 transition-colors"
              (click)="onMakeFavorite($event)"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                />
              </svg>
              <span>{{ workoutValue.favorite ? 'Unfavorite' : 'Make favorite' }}</span>
            </button>
            <button
              type="button"
              class="w-full text-left px-4 py-3 hover:bg-white/5 text-text-main text-sm flex items-center gap-3 transition-colors"
              (click)="onEdit($event)"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"
                />
              </svg>
              <span>Edit</span>
            </button>
            <button
              type="button"
              class="w-full text-left px-4 py-3 hover:bg-white/5 text-red-400 text-sm flex items-center gap-3 transition-colors"
              (click)="onDelete($event)"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
                />
              </svg>
              <span>Delete</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- exercises -->
  <div class="flex-1 px-4 flex flex-col gap-8 pb-32 overflow-y-auto">
    @for (exercise of workoutValue.exercises; track exercise.name) {
      <app-exercise-card [exercise]="exercise"></app-exercise-card>
    }
  </div>

  <!-- start btn -->
  <div
    class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-6 bg-gradient-to-t from-background-dark via-background-dark to-transparent z-30"
  >
    <button
      [disabled]="isThereActiveSession()"
      (click)="onStartWorkout()"
      class="w-full h-14 bg-primary text-black font-bold text-lg rounded-full shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
    >
      <span class="material-symbols-outlined">exercise</span>
      Start Workout
    </button>
  </div>

  <!-- Delete Confirmation Dialog -->
  <app-confirm-dialog
    [isOpen]="isDeleteDialogOpen()"
    title="Delete Workout"
    [message]="
      'Are you sure you want to delete &quot;' +
      (workoutValue.name || '') +
      '&quot;? This action cannot be undone.'
    "
    [confirmText]="isDeleting() ? 'Deleting...' : 'Delete'"
    cancelText="Cancel"
    (confirmed)="onConfirmDelete()"
    (cancelled)="onCancelDelete()"
  ></app-confirm-dialog>
}
