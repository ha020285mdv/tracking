<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between px-2">
    <h2 class="text-xl font-bold text-text-main leading-tight">Select Workout</h2>
    <a
      routerLink="/workouts/new"
      class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary/90 transition-colors"
    >
      + Create
    </a>
  </div>
  <div class="flex flex-col gap-3">
    @for (workout of workouts(); track workout.id) {
      <app-workout-item
        [workout]="workout"
        (makeFavorite)="onMakeFavorite($event)"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      ></app-workout-item>
    }
  </div>
</div>

<!-- Delete Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="isDeleteDialogOpen()"
  title="Delete Workout"
  [message]="
    'Are you sure you want to delete &quot;' +
    (workoutToDelete()?.name || '') +
    '&quot;? This action cannot be undone.'
  "
  [confirmText]="isDeleting() ? 'Deleting...' : 'Delete'"
  cancelText="Cancel"
  (confirmed)="onConfirmDelete()"
  (cancelled)="onCancelDelete()"
></app-confirm-dialog>
