<div class="px-6 py-4">
  <div class="flex justify-between items-end mb-2">
    <span class="text-sm font-bold text-text-main uppercase tracking-wider text-[11px]"
      >Workout Progress</span
    >
    <span class="text-xs font-bold bg-primary px-2 py-0.5 rounded text-black"
      >{{ progress() }}%</span
    >
  </div>
  <div class="h-2 w-full bg-gray-700 rounded-full overflow-hidden">
    <div
      class="h-full bg-primary rounded-full shadow-[0_0_10px_rgba(0,127,255,0.5)]"
      [style.width.%]="progress()"
    ></div>
  </div>
</div>
