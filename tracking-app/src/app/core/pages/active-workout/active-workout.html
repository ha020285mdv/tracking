<!-- header. todo: move to layout -->
<div
  class="pt-6 pb-2 px-4 sticky top-0 z-20 bg-background-dark/95 backdrop-blur-sm border-b border-white/5"
>
  <div class="flex items-center justify-between h-14 mb-2">
    <button
      class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-white/10 transition-colors text-text-main"
    >
      <span class="material-symbols-outlined text-[28px]">arrow_back</span>
    </button>
    <button
      class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-white/10 transition-colors text-text-main"
    >
      <span class="material-symbols-outlined text-[28px]">more_vert</span>
    </button>
  </div>

  <!-- components header -->
  <div class="flex flex-col gap-1 px-2">
    <h1 class="text-3xl font-bold text-text-main tracking-tight">Leg Day - Week 4</h1>
    <p class="text-text-muted font-medium text-sm flex items-center gap-1">
      <span class="material-symbols-outlined text-[16px]">schedule</span> 45 mins
      <span class="mx-1">•</span>
      <span class="material-symbols-outlined text-[16px]">equalizer</span> Intermediate
    </p>
  </div>
</div>
<!-- progress-bar -->
<app-progress-bar [progress]="progress()"></app-progress-bar>

<!-- exercises -->
<div class="flex-1 px-4 flex flex-col gap-8 pb-32 overflow-y-auto">
  @for (exercise of workout().exercises; track exercise.name) {
    <app-exercise-card [exercise]="exercise"></app-exercise-card>
  }
</div>

<!-- finish btn -->
<div
  class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-dark via-background-dark to-transparent pointer-events-none z-30"
>
  <button
    class="pointer-events-auto w-full h-14 bg-primary text-black font-bold text-lg rounded-full shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
  >
    <span class="material-symbols-outlined">flag</span>
    Finish Workout
  </button>
</div>
