<div class="min-h-screen flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-text-main mb-2">
        {{ isSignUp() ? 'Create Account' : 'Welcome Back' }}
      </h1>
      <p class="text-text-muted text-sm">
        {{ isSignUp() ? 'Sign up to start tracking your workouts' : 'Sign in to continue' }}
      </p>
    </div>

    <!-- Error Message -->
    @if (error()) {
    <div class="mb-6 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/20">
      <p class="text-sm text-red-400 text-center">{{ error() }}</p>
    </div>
    }

    <!-- Email/Password Form -->
    <form (submit)="handleEmailAuth(); $event.preventDefault()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-text-main mb-2"> Email </label>
        <input
          type="email"
          id="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="your@email.com"
          required
          [disabled]="isLoading()"
          class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-text-main placeholder:text-text-muted/50 focus:outline-none focus:border-blue-500 focus:bg-white/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-text-main mb-2">
          Password
        </label>
        <input
          type="password"
          id="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          placeholder="••••••••"
          required
          [disabled]="isLoading()"
          class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-text-main placeholder:text-text-muted/50 focus:outline-none focus:border-blue-500 focus:bg-white/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full px-4 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 active:bg-blue-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
      >
        {{ isLoading() ? 'Processing...' : isSignUp() ? 'Sign Up' : 'Sign In' }}
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-white/10"></div>
      </div>
      <div class="relative flex justify-center text-xs uppercase">
        <span class="bg-background-dark px-2 text-text-muted">Or</span>
      </div>
    </div>

    <!-- Google Sign In -->
    <button
      type="button"
      (click)="handleGoogleSignIn()"
      [disabled]="isLoading()"
      class="w-full px-4 py-3 bg-white/5 border border-white/10 text-text-main font-medium rounded-lg hover:bg-white/10 active:bg-white/15 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3"
    >
      <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
        />
        <path
          fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
        />
        <path
          fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
        />
        <path fill="none" d="M0 0h48v48H0z" />
      </svg>
      Continue with Google
    </button>

    <!-- Toggle Sign In/Up -->
    <div class="mt-6 text-center">
      <span class="text-text-muted text-sm">
        {{ isSignUp() ? 'Already have an account?' : "Don't have an account?" }}
      </span>
      <button
        type="button"
        (click)="toggleMode()"
        class="ml-2 text-blue-400 text-sm font-medium hover:text-blue-300 transition-colors"
      >
        {{ isSignUp() ? 'Sign In' : 'Sign Up' }}
      </button>
    </div>
  </div>
</div>
