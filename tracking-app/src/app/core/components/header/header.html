<div class="pb-2 px-4 sticky top-0 z-20 bg-background-dark/95 backdrop-blur-sm">
  <div class="flex items-center justify-between h-14">
    @if (showBackButton) {
    <button
      routerLink="/"
      class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-white/10 transition-colors text-text-main"
    >
      <span class="material-symbols-outlined text-[28px]">arrow_back</span>
    </button>
    } @else {
    <div class="w-12 h-12"></div>
    }
    <button
      class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-white/10 transition-colors text-text-main"
    >
      <span class="material-symbols-outlined text-[28px]">more_vert</span>
    </button>
  </div>
</div>
